name: nightly-game

on:
  schedule:
    # 22:00 UTC = midnight Amsterdam (CEST/summer)
    # 23:00 UTC = midnight Amsterdam (CET/winter)
    # The Amsterdam-hour guard in runner.main() ensures only one runs.
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  play:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runner
        working-directory: runner
        run: pip install -e .

      - name: Play a game
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY:       ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY:  ${{ secrets.MOONSHOT_API_KEY }}
          BYTEPLUS_API_KEY:  ${{ secrets.BYTEPLUS_API_KEY }}
          ARK_API_KEY:       ${{ secrets.ARK_API_KEY }}
        # On cron, enforce the Amsterdam-midnight guard. On manual
        # workflow_dispatch, the trigger is intentional — bypass the guard.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m dixit_ai --dry-run
          else
            python -m dixit_ai
          fi

      - name: Commit results
        run: |
          git config user.name  "dixit-bot"
          git config user.email "dixit-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "no data changes; the Amsterdam-hour guard probably skipped this run"
            exit 0
          fi
          git add data/
          git commit -m "game $(date -u +%Y-%m-%d)"
          git push
