# Nightly Dixit player roster. Edit here to add, remove, or swap models.
#
# Each entry instantiates one adapter:
#   adapter      — which adapter class to use (claude | openai | gemini | grok | mistral)
#   model_id     — the provider's API model ID (must be vision-capable)
#   display_name — what the leaderboard shows
#   previous_ids — optional list of prior model_ids whose Elo history this entry inherits

players:
  - adapter: claude
    model_id: claude-opus-4-7
    display_name: Claude Opus 4.7
  - adapter: openai
    model_id: gpt-5.5
    display_name: GPT-5.5
  - adapter: gemini
    # Preview model — Gemini 3.5 Pro was announced at I/O 2026 but ships
    # in June; 3.1 Pro is the current Pro-tier model on the API.
    model_id: gemini-3.1-pro-preview
    display_name: Gemini 3.1 Pro
    previous_ids: [gemini-2.5-pro]
  - adapter: grok
    model_id: grok-4.3
    display_name: Grok 4.3
  - adapter: mistral
    model_id: mistral-large-2512
    display_name: Mistral Large 3
    previous_ids: [mistral-medium-3.5]
