# Nightly Dixit player roster. Edit here to add, remove, or swap models.
#
# Roster rule: the top 6 distinct organizations on the LMArena *vision*
# leaderboard (https://arena.ai/leaderboard/vision), excluding any row LMArena
# tags "preliminary", taking each org's highest-ranked eligible row.
# Snapshot: 2026-05-26. Re-run the rule to refresh.
#
# Each entry instantiates one adapter:
#   adapter       — which adapter class to use
#                   (claude | openai | gemini | grok | mistral | bytedance | moonshot)
#   model_id      — the provider's API model ID (must be vision-capable)
#   display_name  — what the leaderboard shows
#   thinking      — optional; claude only. Enables extended thinking.
#
# Models that go down are not backstopped — that player just forfeits its moves
# and the game still finishes. Use the smoke workflow to spot a dead model, then
# fix the id here and re-run manually.

players:
  - adapter: claude
    # Identity matches the LMArena row name. The adapter strips the "-thinking"
    # suffix for the actual API call (thinking is a request param, not a model id).
    model_id: claude-opus-4-7-thinking
    # Same model as the earlier non-thinking claude-opus-4-7; stats.py aliases
    # the two onto one leaderboard line, so keep the display name unqualified.
    display_name: Claude Opus 4.7
    thinking: true
  - adapter: gemini
    # gemini-3-pro / gemini-3-pro-preview is retired ("no longer available"),
    # so the top callable non-preliminary Google row is gemini-3.1-pro-preview.
    model_id: gemini-3.1-pro-preview
    display_name: Gemini 3.1 Pro
  - adapter: openai
    model_id: gpt-5.5
    display_name: GPT-5.5
  - adapter: grok
    # Top non-preliminary xAI row on the vision board (a beta reasoning build).
    model_id: grok-4.20-beta-0309-reasoning
    display_name: Grok 4.20 (reasoning)
  - adapter: bytedance
    # ByteDance Seed 2.0 Pro via BytePlus ModelArk (OpenAI-compatible) — the
    # leaderboard's top ByteDance row.
    model_id: seed-2-0-pro-260328
    display_name: Seed 2.0 Pro
  - adapter: moonshot
    model_id: kimi-k2.6
    display_name: Kimi K2.6
